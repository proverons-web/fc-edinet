name: FC Edinet Responsive QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  responsive:
    name: Public UI regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Guard Next.js client component directives
        run: npm run qa:client-directives
      - name: Check all TypeScript sources before UI tests
        run: npm run typecheck
      - name: Verify public routes and release contracts
        run: node scripts/qa-site.mjs
      - name: Check CSS cascade budget
        run: node scripts/qa-css-audit.mjs
      - name: Check CSS empty rules and keyboard focus contracts
        run: node scripts/qa-css-polish-v2312.mjs
      - name: Check dependency and database security contracts
        run: node scripts/qa-security.mjs
      - name: Check editorial workflow and publishing protections
        run: node scripts/qa-editorial.mjs
      - name: Check admin search and daily operations
        run: node --experimental-strip-types scripts/qa-admin-ops.mjs
      - name: Check administrator attention filters and media operations
        run: node --experimental-strip-types scripts/qa-admin-attention.mjs
      - name: Verify match data integrity and error propagation
        run: node --experimental-strip-types scripts/qa-data-integrity.mjs
      - name: Verify atomic lineup persistence and stale-form protection
        run: node scripts/qa-atomic-lineups.mjs
      - name: Verify atomic player statistics and completion status
        run: node scripts/qa-transactional-player-stats.mjs
      - name: Check match center workflow and unsaved form protection
        run: node scripts/qa-match-workflow.mjs
      - name: Match entry QA
        run: node scripts/qa-match-entry.mjs
      - name: Public match stats and mobile timeline QA
        run: node --experimental-strip-types scripts/qa-public-match-v2298.mjs
      - name: Public player match statistics and identity QA
        run: node --experimental-strip-types scripts/qa-public-player-v2299.mjs
      - name: Public player lineup responsive geometry
        run: node scripts/qa-public-player-layout.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Public match integrity (live calendar, score, venue, routes)
        run: node --experimental-strip-types scripts/qa-public-integrity-v22913.mjs
      - name: Check all literal internal routes resolve
        run: node scripts/qa-public-routes-v22913.mjs
      - name: Check hall of fame catalogue and profile contracts
        run: node --experimental-strip-types scripts/qa-hall-of-fame.mjs
      - name: Check hall of fame responsive card geometry
        run: node scripts/qa-hall-layout.mjs
      - name: Check performance and image delivery contracts
        run: node scripts/qa-performance.mjs
      - name: Check v2.30.15 cache correctness and release stability
        run: node scripts/qa-performance-stability-v2310.mjs
      - name: Verify v2.30.15 mobile navigation and image-delivery contracts
        run: node scripts/qa-mobile-experience-v2311.mjs
      - name: Check v2.30.15 production-health smoke runner (offline fixture)
        run: node scripts/qa-production-health-v2313.mjs
      - name: Multi-competition regression QA
        run: node --experimental-strip-types scripts/qa-competitions-v2316.mjs && node --experimental-strip-types scripts/qa-schedule-v2317.mjs
      - name: Cup match decisions and competition-by-competition statistics QA
        run: node --experimental-strip-types scripts/qa-cup-v2318.mjs
      - name: Cup bracket progression and RLS regression QA
        run: node --experimental-strip-types scripts/qa-cup-bracket-v2319.mjs
      - name: Two-leg cup ties, automatic progression and SQL guards
        run: node --experimental-strip-types scripts/qa-cup-two-leg-v2320.mjs
      - name: Real-user monitoring, privacy and p75 QA
        run: node --experimental-strip-types scripts/qa-rum-v2314.mjs
      - name: RUM operations and Node runtime pin QA
        run: node --experimental-strip-types scripts/qa-rum-health-v2315.mjs
      - name: Check new match galleries and image viewer
        run: |
          node scripts/qa-match-media-v2302.mjs
          node scripts/qa-media-gallery-v2303.mjs
          node scripts/qa-media-albums-v2305.mjs
      - name: Check match videos and club history archive
        run: |
          node --experimental-strip-types scripts/qa-match-videos-v2304.mjs
          node --experimental-strip-types scripts/qa-club-seasons-v2306.mjs
          node --experimental-strip-types scripts/qa-club-history-v2307.mjs
      - name: Check social images and club match logos
        run: |
          node --experimental-strip-types scripts/qa-seo-social-v2308.mjs
          node --experimental-strip-types scripts/qa-social-match-logos-v2309.mjs
      - name: Validate match calendar subscription and sharing contracts
        run: node --experimental-strip-types scripts/qa-fan-experience.mjs
      - name: Check fan action geometry across mobile and desktop widths
        run: node scripts/qa-fan-layout.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Personalized fan dashboard logic and privacy contracts
        run: node --experimental-strip-types scripts/qa-fan-dashboard.mjs
      - name: Fan dashboard mobile geometry
        run: node scripts/qa-fan-dashboard-layout.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: UI visual consistency against approved baseline
        run: node scripts/qa-ui-consistency.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Check responsive layout in Chrome
        run: node scripts/qa-responsive.mjs --screenshots
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Player profile navigation contracts
        run: node --experimental-strip-types scripts/qa-player-navigation-v22910.mjs
      - name: Player profile navigation layout
        run: node scripts/qa-player-navigation-layout.mjs
      - name: Keep QA screenshots after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-qa-screenshots
          path: qa-artifacts/
          if-no-files-found: ignore

